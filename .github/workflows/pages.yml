name: Deploy Dareqo Digital to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site
          cp \
            index.html \
            manager.html \
            document.html \
            dareqo-digital-logo.svg \
            manager-core.js \
            manager-actions.js \
            manager-expenses.js \
            manager-customer-editor.js \
            web-design-lebanon.html \
            business-management-system-lebanon.html \
            local-seo-lebanon.html \
            robots.txt \
            sitemap.xml \
            .nojekyll \
            public-site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
